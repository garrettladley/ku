name: Security Audit

on:
  schedule:
    # Check for newly disclosed advisories even when the lockfile has not changed.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the repository toolchain
        run: rustup show active-toolchain
      - name: Install the pinned audit tool
        run: cargo install cargo-deny --version 0.19.0 --locked
      - name: Check the locked dependencies against current advisories
        run: cargo deny --locked check advisories
