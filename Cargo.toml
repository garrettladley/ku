[workspace]
members = ["crates/core", "crates/solvers", "crates/session", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
authors = ["Garrett Ladley"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
rand = { version = "0.9.2", default-features = false, features = ["small_rng"] }
rayon = "1.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-themes = { version = "0.3", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
missing_docs = "deny"
# Permit narrowly scoped opt-ins for measured optimizations.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
perf = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.bench]
debug = true
